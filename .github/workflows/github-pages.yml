name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront for GitHub Pages
        run: |
          cd apps/storefront
          cp next.config.github.js next.config.js
          NEXT_PUBLIC_DEMO_MODE=true pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://purebio.me

      - name: Add .nojekyll and CNAME
        run: |
          touch apps/storefront/dist/.nojekyll
          cp apps/storefront/public/CNAME apps/storefront/dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront/dist

  deploy:
    environment:
      name: github-pages
      url: https://purebio.me
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
