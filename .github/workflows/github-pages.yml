# Last updated: 2026-04-27T00:02:00Z - Force refresh
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/purebio-me-marketing-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --pretty=%B)"
          echo "Branch: ${{ github.ref_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify static export compatibility
        run: node scripts/verify-static-export.mjs

      - name: Build storefront for GitHub Pages
        run: |
          cd apps/storefront
          cp next.config.github.js next.config.js
          NEXT_PUBLIC_DEMO_MODE=true STATIC_EXPORT=true pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://purebio.me
          STATIC_EXPORT: true

      - name: Add .nojekyll and CNAME
        run: |
          touch apps/storefront/dist/.nojekyll
          cp apps/storefront/public/CNAME apps/storefront/dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront/dist

  deploy:
    environment:
      name: github-pages
      url: https://purebio.me
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
