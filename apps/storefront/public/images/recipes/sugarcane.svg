<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="caneStalk" x1="0%" y1="100%" x2="30%" y2="0%">
      <stop offset="0%" stop-color="#0f2e26"/>
      <stop offset="45%" stop-color="#1f5c48"/>
      <stop offset="100%" stop-color="#3d8f6f"/>
    </linearGradient>
    <linearGradient id="caneLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fc4a3"/>
      <stop offset="100%" stop-color="#2a6b52"/>
    </linearGradient>
    <linearGradient id="caneGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8d49a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <!-- Soft field haze -->
  <ellipse cx="280" cy="480" rx="220" ry="120" fill="url(#caneGold)" opacity="0.12"/>
  <!-- Rear stalk -->
  <path d="M300 540 C292 400 310 260 285 90" stroke="url(#caneStalk)" stroke-width="11" stroke-linecap="round" opacity="0.55"/>
  <path d="M268 200 Q285 195 298 175" stroke="url(#caneLeaf)" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <!-- Mid stalk -->
  <path d="M195 545 C188 390 205 230 215 70" stroke="url(#caneStalk)" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="208" cy="180" rx="42" ry="10" transform="rotate(-35 208 180)" fill="url(#caneLeaf)" opacity="0.85"/>
  <ellipse cx="225" cy="260" rx="48" ry="11" transform="rotate(-22 225 260)" fill="url(#caneLeaf)" opacity="0.75"/>
  <ellipse cx="200" cy="340" rx="44" ry="10" transform="rotate(-48 200 340)" fill="url(#caneLeaf)" opacity="0.65"/>
  <!-- Nodes (joints) -->
  <ellipse cx="212" cy="130" rx="9" ry="4" transform="rotate(-8 212 130)" fill="#1a4036" opacity="0.35"/>
  <ellipse cx="208" cy="220" rx="10" ry="4" transform="rotate(-5 208 220)" fill="#1a4036" opacity="0.35"/>
  <ellipse cx="202" cy="310" rx="10" ry="4" transform="rotate(4 202 310)" fill="#1a4036" opacity="0.35"/>
  <!-- Front stalk -->
  <path d="M120 550 C108 360 125 210 145 60" stroke="url(#caneStalk)" stroke-width="15" stroke-linecap="round"/>
  <ellipse cx="138" cy="150" rx="50" ry="12" transform="rotate(28 138 150)" fill="url(#caneLeaf)" opacity="0.9"/>
  <ellipse cx="128" cy="240" rx="46" ry="11" transform="rotate(42 128 240)" fill="url(#caneLeaf)" opacity="0.8"/>
  <ellipse cx="118" cy="330" rx="40" ry="9" transform="rotate(55 118 330)" fill="url(#caneLeaf)" opacity="0.7"/>
  <ellipse cx="132" cy="115" rx="10" ry="4" transform="rotate(12 132 115)" fill="#1a4036" opacity="0.4"/>
  <ellipse cx="128" cy="205" rx="11" ry="4" transform="rotate(8 128 205)" fill="#1a4036" opacity="0.4"/>
  <!-- Floating pollen / light specks -->
  <circle cx="320" cy="120" r="3" fill="#c9a227" opacity="0.35"/>
  <circle cx="350" cy="200" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="90" cy="180" r="2.5" fill="#c9a227" opacity="0.3"/>
</svg>
